name: Deploy Pages (pnpm)

'on':
  push:
    branches: ['master']
  workflow_dispatch:
    inputs:
      skip_integration:
        description: 'Skip integration tests (manual runs only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  verify-and-deploy:
    name: Build and Deploy Pipeline
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        env:
          CI: true

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_integration) }}
        run: pnpm run test:integration

      - name: Build project
        run: pnpm run build

      - name: Smoke Tests (Output Verification)
        run: pnpm test:smoke

      - name: Validate built HTML
        run: pnpm run build:validate:html

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build-prod

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  e2e-tests:
    name: E2E Tests (Post-Deploy)
    needs: verify-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: E2E tests against deployed site
        run: node --test "tests/e2e/**/*.test.js"
        env:
          E2E_BASE_URL: ${{ needs.verify-and-deploy.outputs.page_url }}
          E2E_RETRY_COUNT: '4'
          E2E_RETRY_DELAY_MS: '15000'
