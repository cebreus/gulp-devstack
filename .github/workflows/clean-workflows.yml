name: Clean Workflow Logs

on:
  workflow_dispatch:
    inputs:
      days_old:
        description: 'The amount of days old to delete'
        default: '7'
        required: false

jobs:
  clean-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: igorjs/gh-actions-clean-workflow@aaadbc9070ae5f7fed327d8c87c41daab39b25f3 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days_old: ${{ github.event.inputs.days_old }}
