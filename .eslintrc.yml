env:
  browser: true
  commonjs: false
  es2021: true

extends:
  - 'eslint:recommended'
  - 'plugin:jsdoc/recommended'
  - 'plugin:regexp/recommended'

plugins:
  - import
  - jsdoc
  - regexp

overrides:
  - files:
      - '*.js'
      - '*.mjs'
      - '*.cjs'

parser: '@babel/eslint-parser'
parserOptions:
  requireConfigFile: false
  babelrc: false
  configFile: false
  ecmaVersion: latest
  sourceType: module
  presets:
    - '@babel/preset-env'

rules:
  no-param-reassign:
    - error
    - props: false
